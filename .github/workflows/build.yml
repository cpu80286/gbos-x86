name: Build gbOS86 Standard Live USB

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build standard image
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Maximize build disk space
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 2048
          temp-reserve-mb: 512
          swap-size-mb: 1024
          remove-dotnet: true
          remove-android: true
          remove-haskell: true
          remove-codeql: true
          remove-docker-images: true

      - name: Checkout source
        uses: actions/checkout@v4

      - name: Move Docker storage to build volume
        shell: bash
        run: |
          set -e
          sudo systemctl stop docker
          sudo mkdir -p "$GITHUB_WORKSPACE/docker-data"
          sudo mkdir -p /etc/docker
          sudo tee /etc/docker/daemon.json > /dev/null <<EOF
          {
            "data-root": "$GITHUB_WORKSPACE/docker-data"
          }
          EOF
          sudo systemctl start docker
          docker info | grep "Docker Root Dir"

      - name: Check build environment
        shell: bash
        run: |
          set -e
          echo "=== Disk space ==="
          df -hT
          echo "=== Docker storage ==="
          docker info | grep "Docker Root Dir"

          WORK_FREE=$(df -BG --output=avail "$GITHUB_WORKSPACE" | tail -1 | tr -dc '0-9')
          DOCKER_FREE=$(df -BG --output=avail "$GITHUB_WORKSPACE/docker-data" | tail -1 | tr -dc '0-9')

          echo "Workspace free: ${WORK_FREE}G"
          echo "Docker free: ${DOCKER_FREE}G"

          if [ "$WORK_FREE" -lt 30 ]; then
            echo "::error::Less than 30GB workspace space."
            exit 1
          fi

          if [ "$DOCKER_FREE" -lt 8 ]; then
            echo "::error::Less than 8GB Docker storage space."
            exit 1
          fi

      - name: Build gbOS86 Standard
        env:
          GBOS_IPU6_CAMERA_BRIDGE: "0"
        shell: bash
        run: |
          set -e
          chmod +x build.sh
          ./build.sh -y --standard

      - name: Prepare image
        shell: bash
        run: |
          set -e
          IMAGE=$(find dist -maxdepth 1 -type f -name 'gbOS86-*.img' -print -quit)

          if [ -z "$IMAGE" ]; then
            echo "::error::Build image not found."
            exit 1
          fi

          RELEASE_DIR="$GITHUB_WORKSPACE/release-assets"
          mkdir -p "$RELEASE_DIR"

          ls -lh "$IMAGE"
          sha256sum "$IMAGE" | sed "s|$IMAGE|gbOS86.img|" > "$RELEASE_DIR/gbOS86.img.sha256"

          split -b 1900M -d -a 3 "$IMAGE" "$RELEASE_DIR/gbOS86.img.part-"

          cat > "$RELEASE_DIR/README.txt" <<'EOF'
          gbOS86 Standard Live USB Image

          Join all gbOS86.img.part-* files in numerical order.
          Verify the restored image using gbOS86.img.sha256.

          WARNING:
          The installer option can erase the internal laptop drive.
          Select Live mode first.
          EOF

          echo "=== Release files ==="
          ls -lh "$RELEASE_DIR"
          df -h "$GITHUB_WORKSPACE"

      - name: Upload private draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -e
          TAG="gbos86-build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          cd "$GITHUB_WORKSPACE/release-assets"

          gh release create "$TAG" \
            gbOS86.img.part-* \
            gbOS86.img.sha256 \
            README.txt \
            --repo "$GITHUB_REPOSITORY" \
            --title "gbOS86 Standard Build ${GITHUB_RUN_ID}" \
            --notes "Automatically built gbOS86 Standard Live USB image." \
            --draft
